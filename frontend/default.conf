server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs configuration and routing
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Rewrite rules from serve.json
    location ~ ^/product/([^/]+)$ {
        try_files /product.html =404;
    }

    location ~ ^/user/([^/]+)$ {
        try_files /user.html =404;
    }

    # Proxy API requests to backend container
    location ~ ^/(api|login|register|verify-email|forgot-password|reset-password|protected|uploads)/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.io
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
