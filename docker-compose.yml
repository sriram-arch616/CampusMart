version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: campus-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-campusmarketplace}
      MYSQL_USER: ${DB_USER:-campus_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-campus_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
      # Automatically initialize database schema on startup
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - campus-network

  redis:
    image: redis:alpine
    container_name: campus-redis
    restart: always
    networks:
      - campus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-backend
    restart: always
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=http://localhost,http://localhost:3000,http://127.0.0.1:3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-campus_user}
      - DB_PASSWORD=${DB_PASSWORD:-campus_password}
      - DB_NAME=${DB_NAME:-campusmarketplace}
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - BREVO_API_KEY=${BREVO_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - uploads-data:/usr/src/frontend/uploads
    networks:
      - campus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - uploads-data:/usr/share/nginx/html/uploads
    networks:
      - campus-network

volumes:
  mysql-data:
  uploads-data:

networks:
  campus-network:
    driver: bridge
